[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "recycleguard"
version = "0.1.0"
description = "Auditable e-waste EPR reconciliation prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3.0.1,<4",
    "pdfplumber>=0.11.10",
    "pydantic>=2.10,<3",
    "typer>=0.15,<1",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
recycleguard = "recycleguard.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recycleguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
