[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "recycleguard"
version = "0.1.0"
description = "Auditable e-waste EPR reconciliation prototype"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
recycleguard = "recycleguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/recycleguard"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
