[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "recycleguard"
version = "0.1.0"
description = "Auditable e-waste EPR reconciliation prototype"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "typer>=0.15,<1"]

[project.scripts]
recycleguard = "recycleguard.cli:app"

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
    "pytest>=8,<9",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recycleguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
