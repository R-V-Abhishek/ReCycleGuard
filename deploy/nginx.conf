# In the UI, use this page's own address as the API address.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        # The API shares the model container's network.
        proxy_pass http://model:8000;
        proxy_http_version 1.1;
        # Runs stream their timeline and can stay quiet for a whole model call.
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }

    location / {
        try_files $uri /index.html;
    }
}
